# Verificação automática do Scorpions.
#
# Por que existe
# --------------
# O Smart App Control do Windows passou a bloquear o `flutter_tester.exe` na
# máquina de desenvolvimento, e com ele os testes deixaram de rodar localmente.
# Desligar essa proteção é irreversível sem reinstalar o sistema, então a
# verificação passou a acontecer aqui — onde o runner é Linux e o bloqueio não
# existe.
#
# O efeito colateral é bom para o TCC: a prova de que os testes passam deixa de
# ser "rodei na minha máquina" e vira um registro público, com data e número de
# testes, que a banca pode conferir.

name: Verificação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite rodar sob demanda pelo site do GitHub

# Um push novo cancela a execução anterior do mesmo ramo: o que importa é o
# estado atual, não a fila.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fixa a versão para que o CI reproduza a máquina de desenvolvimento. Subir
  # o Flutter passa a ser uma decisão escrita neste arquivo, e não um efeito
  # colateral de o runner ter atualizado sozinho.
  FLUTTER_VERSION: '3.44.6'

jobs:
  aplicativo:
    name: Análise e testes do app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test --reporter expanded

  backend:
    name: Backend de inferência
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O Flutter entra aqui por um motivo só: GERAR os casos de paridade.
      #
      # A lógica de fusão e decisão existe em Dart e em Python — o servidor
      # precisa dela porque é ele quem grava o resultado (auditoria HIGH-1), e
      # o aplicativo precisa dela para o modo de demonstração, que roda sem
      # rede. Duas implementações da mesma ideia divergem em silêncio.
      #
      # Então os casos não são escritos à mão: o teste Dart EXECUTA a
      # implementação dele e grava o que produziu, e o pytest verifica que a
      # implementação Python produz o mesmo. Divergiu, o CI quebra — com o
      # caso exato e os dois valores.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Dependências do app
        run: flutter pub get

      - name: Gerar os casos de paridade
        run: flutter test test/fusion_cases_test.dart

      - name: Dependências do backend
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Testes do backend
        working-directory: backend
        run: python -m pytest tests/ -v

  regras:
    name: Security Rules no emulador
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # O emulador do Firestore roda na JVM, e o firebase-tools exige **21 ou
      # acima**. Com 17 ele nem sobe o emulador: falha com "no longer supports
      # Java version before 21" antes de avaliar uma regra sequer.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Dependências do app
        run: flutter pub get

      # Este passo é o que dá sentido ao job. As formas de contrato são
      # GERADAS a partir dos modelos de produção, não escritas à mão — foi
      # assim que um bug real apareceu: o mapa de criação de usuário não
      # trazia `role`, a regra exigia, e os testes passavam porque inventavam
      # o documento em vez de usar o de verdade.
      - name: Gerar as formas de contrato
        run: flutter test test/contract_shapes_test.dart

      - name: Dependências do Firebase
        working-directory: firebase
        run: npm ci

      - name: Regras contra o emulador
        working-directory: firebase
        # Versão fixada de propósito. Com `@latest`, uma publicação do
        # firebase-tools quebraria esta verificação sem ninguém ter tocado no
        # projeto — e a falha pareceria um defeito do código.
        run: npx --yes firebase-tools@15 emulators:exec --project demo-scorpions --only firestore,storage,auth "node --test --test-concurrency=1 test/firestore.test.mjs test/storage.test.mjs test/contract.test.mjs"

  segredos:
    name: Varredura de segredos e dependências
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` traz o histórico inteiro, e é o ponto do job.
      #
      # Com a profundidade padrão (1), a varredura veria só o commit do topo.
      # Um segredo commitado e removido no commit seguinte continuaria no
      # histórico, recuperável por qualquer pessoa que clonasse o repositório —
      # e a varredura diria que está tudo bem.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A auditoria de criptografia (C-1) varreu o histórico à mão e não achou
      # segredo nenhum: só a chave de API do Firebase para cliente, que é
      # pública por desenho, e um `"private_key":"nao-e-uma-chave"` de teste.
      #
      # Mas aquele resultado vale para aquele dia. O próximo commit não é
      # coberto por ele, e um segredo commitado por engano às onze da noite não
      # espera a próxima auditoria. É a lacuna mais acionável que a auditoria
      # encontrou: barato de fechar, e fecha um caminho que revisão humana não
      # cobre de forma confiável.
      # A configuração vive em `.gitleaks.toml`, na raiz, e as exceções dela são
      # estreitas de propósito: só o padrão `AIza…`, só nos arquivos que o
      # Firebase gera. As outras ~150 regras continuam valendo em todos os
      # arquivos, inclusive nesses. O cabeçalho daquele arquivo explica por que a
      # chave de API do cliente não é segredo, e por que uma lista de exceções
      # ampla transformaria esta varredura em teatro.
      #
      # Se este passo falhar: **não** adicione exceção para fazer passar. Siga o
      # procedimento de `security/CRYPTO_AUDIT.md` (61.8) — revogar, rotacionar,
      # investigar, auditar.
      #
      # Nota: a `gitleaks-action` pede `GITLEAKS_LICENSE` para repositório de
      # organização. Para repositório pessoal, como este, não precisa.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Vulnerabilidades conhecidas nas dependências do backend (FASE 27/30).
      #
      # `|| true` NÃO está aqui: se houver vulnerabilidade conhecida numa
      # dependência de produção, o job falha. O briefing §47 pede que o
      # pipeline bloqueie, e um aviso que ninguém lê não bloqueia nada.
      - name: Vulnerabilidades no backend
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --strict

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Informativo, de propósito: `pub outdated` reporta versões novas, não
      # vulnerabilidades. Quebrar o CI porque um pacote publicou uma versão
      # seria quebrar o CI sem ninguém ter tocado no projeto. O que vale aqui é
      # a saída ficar registrada na execução, para leitura humana.
      - name: Dependências desatualizadas do app (informativo)
        run: |
          flutter pub get
          flutter pub outdated || true
