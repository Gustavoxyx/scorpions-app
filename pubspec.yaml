name: scorpions
description: "Identificacao cientifica de escorpioes por imagem"
publish_to: 'none'

# Versão de produto. Mantida em sincronia com AppConfig.version.
version: 0.3.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Não aparece em nenhum `import` — e mesmo assim precisa ficar.
  #
  # `app_theme.dart` usa `CupertinoPageTransitionsBuilder` para dar ao iOS e
  # ao macOS a transição de página nativa. Importar `package:flutter/
  # cupertino.dart` traz junto a classe `CupertinoIcons`, cujos `IconData`
  # declaram a família de fontes deste pacote. Sem ele o build avisa
  # "Expected to find fonts for (…CupertinoIcons)" a cada compilação.
  #
  # Não pesa: o tree-shaking de ícones remove os glifos não usados.
  # Já foi removido uma vez numa limpeza de dependências; este comentário
  # existe para que não seja removido de novo.
  cupertino_icons: ^1.0.8

  # --- Navegação ------------------------------------------------------------
  # go_router: rotas declarativas + StatefulShellRoute (abas com estado) +
  # guarda de acesso centralizada. Ver app/router/.
  go_router: ^17.0.0

  # --- Estado ---------------------------------------------------------------
  # provider: injeção e observação de ChangeNotifier sem geração de código
  # (build_runner seria pesado nesta máquina). Substituível por Riverpod/Bloc
  # sem tocar nas telas, pois elas só consomem context.watch<T>().
  provider: ^6.1.2

  # --- Câmera e imagens -----------------------------------------------------
  # Ambos ficam atrás de interfaces em data/services/. Em plataformas sem
  # suporte, os serviços caem para o modo simulado e o fluxo continua.
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  firebase_app_check: ^0.4.7
  image: ^4.10.1
  permission_handler: ^13.0.2
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Nenhum asset. A identidade visual — marca, placas de espécie,
  # ilustrações do onboarding — é desenhada com CustomPainter, e o
  # aplicativo não carrega um único arquivo de imagem. Quando houver
  # fotografias licenciadas (Fase 7), declare a pasta assets/ aqui.
